# Ein Secret speichert vertrauliche Werte getrennt von den Deployments.
# Achtung: Diese Datei enthält das Passwort im Klartext. In echten Projekten
# gehört sie NICHT ins Git-Repository. Für diese Übung reicht es so.
apiVersion: v1
kind: Secret
metadata:
  name: db-zugang
type: Opaque
# stringData: Werte im Klartext, Kubernetes wandelt sie beim Speichern in Base64 um
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: geheim123
  POSTGRES_DB: kursdb
